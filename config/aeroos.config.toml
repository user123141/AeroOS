# AeroOS Configuration v2.0.0

[cpu]
cores = 4
model = "host"

[memory]
ram_mb = 8192

[gpu]
model = "virtio-gpu"
accel_3d = true
passthrough = false

[disk]
# image_path = "disk.img"
interface = "virtio"

[snapshot]
auto_interval_ms = 1000
max_count = 100
dir = "snapshots"
dedup = true
max_size_mb = 10240
encrypt = false
# Новое в v2.0: RAM-only режим (эфемерная ВМ)
ram_only = false

mode = "embedded"