<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:8081">
<title>AeroOS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
</head>
<body>
<div class="desktop">
  <!-- AeroDock -->
  <div class="glass-panel dock">
    <div class="dock-item" data-app="terminal" title="AeroTerm"></div>
    <div class="dock-item" data-app="browser" title="AeroBrowser"></div>
    <div class="dock-item" data-app="files" title="AeroFiles"></div>
    <div class="dock-item" data-app="snapshots" title="Snapshots"></div>
    <div class="dock-item" data-app="settings" title="Settings"></div>
  </div>

  <!-- Main window -->
  <div class="glass-panel window" id="window-main">
    <div class="window-header">
      <span class="window-title">AeroOS</span>
      <div class="window-controls">
        <button class="close"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content">
      <h1>AeroOS</h1>
      <p id="status">Initializing...</p>
      <div id="system-info">
        <div class="info-row"><span>CPU</span><span id="cpu-cores">-</span></div>
        <div class="info-row"><span>RAM</span><span id="ram-size">-</span></div>
        <div class="info-row"><span>GPU</span><span id="gpu-model">-</span></div>
        <div class="info-row"><span>Status</span><span id="vm-status">-</span></div>
        <div class="info-row"><span>Snapshots</span><span id="snap-count">0</span></div>
        <div class="info-row"><span>Dirty pages</span><span id="dirty-pages">0</span></div>
      </div>
      <div id="snapshots-panel" class="hidden">
        <h3>Snapshots</h3>
        <ul id="snapshot-list"></ul>
        <button id="create-snapshot">Create snapshot</button>
      </div>
    </div>
  </div>

  <!-- AeroTerm -->
  <div class="glass-panel window hidden" id="window-terminal">
    <div class="window-header">
      <span class="window-title">AeroTerm</span>
      <div class="window-controls">
        <button class="close-terminal"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content terminal-content">
      <div id="xterm-container"></div>
    </div>
  </div>

  <!-- AeroBrowser -->
  <div class="glass-panel window hidden" id="window-browser">
    <div class="window-header">
      <span class="window-title">AeroBrowser</span>
      <div class="window-controls">
        <button class="close-browser"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content browser-content">
      <div class="browser-toolbar">
        <input type="text" id="browser-url" placeholder="https://example.com" />
        <button id="browser-go">Go</button>
      </div>
      <iframe id="browser-frame" src="about:blank" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <!-- AeroFiles -->
  <div class="glass-panel window hidden" id="window-files">
    <div class="window-header">
      <span class="window-title">AeroFiles</span>
      <div class="window-controls">
        <button class="close-files"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content">
      <div id="file-list"></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="glass-panel window hidden" id="window-settings">
    <div class="window-header">
      <span class="window-title">Settings</span>
      <div class="window-controls">
        <button class="close-settings"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content">
      <h3>VM Configuration</h3>
      <div class="setting-row"><label>CPU cores</label><span id="cfg-cpu">-</span></div>
      <div class="setting-row"><label>RAM (MB)</label><span id="cfg-ram">-</span></div>
      <div class="setting-row"><label>GPU</label><span id="cfg-gpu">-</span></div>
      <div class="setting-row"><label>Mode</label><span id="cfg-mode">-</span></div>
      <p class="settings-note">Edit <code>aeroos.config.toml</code> to change.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="js/main.js"></script>
<script src="js/terminal.js"></script>
<script src="js/browser.js"></script>
<script src="js/files.js"></script>
</body>
</html>
