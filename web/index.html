<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:8081">
<title>AeroOS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="desktop">
  <div class="glass-panel dock">
    <div class="dock-item" data-app="dashboard" title="Dashboard"></div>
    <div class="dock-item" data-app="terminal" title="AeroTerm"></div>
    <div class="dock-item" data-app="timeline" title="Time Travel"></div>
    <div class="dock-item" data-app="settings" title="Settings"></div>
  </div>

  <div class="glass-panel window" id="window-dashboard">
    <div class="window-header">
      <span class="window-title">AeroOS Dashboard</span>
      <div class="window-controls">
        <button class="theme-toggle" title="Toggle theme">◐</button>
        <button class="close"></button><button class="minimize"></button><button class="maximize"></button>
      </div>
    </div>
    <div class="window-content">
      <div class="vm-tabs" id="vm-tabs"></div>
      <div class="hero"><h1>AeroOS</h1><p class="subtitle">Portable OS · v2.9.0 Vertex</p></div>
      <div class="cards">
        <div class="card"><div class="card-label">CPU</div><div class="card-value" id="cpu-cores">—</div></div>
        <div class="card"><div class="card-label">RAM</div><div class="card-value" id="ram-size">—</div></div>
        <div class="card"><div class="card-label">GPU</div><div class="card-value" id="gpu-model">—</div></div>
        <div class="card"><div class="card-label">VM</div><div class="card-value" id="vm-status">—</div></div>
      </div>
      <div class="charts">
        <div class="chart-block"><div class="chart-title">CPU</div><canvas id="chart-cpu" width="560" height="120"></canvas></div>
        <div class="chart-block"><div class="chart-title">Memory</div><canvas id="chart-mem" width="560" height="120"></canvas></div>
      </div>
      <div class="vm-stats-panel" id="vm-stats-panel">
        <h3 class="vm-stats-title">Virtual Machines</h3>
        <div class="vm-stats-grid" id="vm-stats-grid"></div>
      </div>
      <div class="stats-row">
        <div class="stat"><span class="stat-label">Snapshots</span><span class="stat-value" id="snap-count">0</span></div>
        <div class="stat"><span class="stat-label">Dirty pages</span><span class="stat-value" id="dirty-pages">0</span></div>
      </div>
    </div>
  </div>

  <div class="glass-panel window hidden" id="window-terminal">
    <div class="window-header"><span class="window-title">AeroTerm</span>
      <div class="window-controls"><button class="close-terminal"></button><button class="minimize"></button><button class="maximize"></button></div>
    </div>
    <div class="window-content terminal-content"><div id="xterm-container"></div></div>
  </div>

  <div class="glass-panel window hidden" id="window-timeline">
    <div class="window-header"><span class="window-title">Time Travel</span>
      <div class="window-controls"><button class="close-timeline"></button><button class="minimize"></button><button class="maximize"></button></div>
    </div>
    <div class="window-content">
      <h3>Snapshot timeline</h3>
      <p class="timeline-help">Move the slider to restore any previous state instantly.</p>
      <input type="range" id="timeline-slider" min="0" max="0" value="0">
      <div class="timeline-labels"><span id="timeline-first">—</span><span id="timeline-selected">now</span><span id="timeline-last">—</span></div>
      <button id="timeline-restore" class="primary-btn">Restore</button>
    </div>
  </div>

  <div class="glass-panel window hidden" id="window-settings">
    <div class="window-header"><span class="window-title">Settings</span>
      <div class="window-controls"><button class="close-settings"></button><button class="minimize"></button><button class="maximize"></button></div>
    </div>
    <div class="window-content">
      <h3>AeroOS Settings</h3>
      <div class="setting-row"><label>Theme</label>
        <select id="theme-select"><option value="dark">Dark</option><option value="light">Light</option><option value="aero">Aero</option></select>
      </div>
      <div class="setting-row"><label>Blur intensity</label><input type="range" id="blur-slider" min="0" max="40" value="20"></div>
      <div class="setting-row"><label>Accent color</label><input type="color" id="accent-picker" value="#4a9eff"></div>
    </div>
  </div>
</div>
<script src="js/main.js"></script>
<script src="js/terminal.js"></script>
<script src="js/charts.js"></script>
<script src="js/timeline.js"></script>
<script src="js/theme.js"></script>
<script src="js/vm-tabs.js"></script>
</body>
</html>
