[package]
name = "aeroos"
version = "4.8.0"
edition = "2021"
authors = ["AeroOS Contributors"]
description = "AeroOS — Portable OS for Windows in a single executable"
license = "MIT"
repository = "https://github.com/user123141/AeroOS"
readme = "README.md"
rust-version = "1.75"
default-run = "aeroos"

[[bin]]
name = "aeroos"
path = "src/main.rs"

[[bin]]
name = "aeroctl"
path = "src/bin/aeroctl.rs"

[[bin]]
name = "gen-license"
path = "src/bin/gen-license.rs"

[[bench]]
name = "snapshot"
harness = false

[dependencies]
whpx   = { path = "vendor/whpx" }
conpty = { path = "vendor/conpty" }

tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.24"
hyper = { version = "1.0", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rust-embed = { version = "8.5", features = ["include-exclude"] }
mime_guess = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
anyhow = "1.0"
thiserror = "2.0"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# --- Networking ---
smoltcp = { version = "0.11", default-features = false, features = [
    "std", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-igmp",
    "proto-dhcpv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4",
] }
socket2 = { version = "0.5", features = ["all"] }

# --- OCI / Registry (без linux-loader) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tar = "0.4"
walkdir = "2.5"
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "errhandlingapi", "memoryapi", "consoleapi", "handleapi", "namedpipeapi", "processenv", "winbase", "wincon", "winnt", "fileapi", "minwindef", "winuser", "std", "securitybaseapi", "processthreadsapi", "winerror"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.13"

[features]
default = []
ape = ["dep:cosmo-build"]
encryption = []
sandbox = []

[build-dependencies]
cosmo-build = { version = "5", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = { version = "5", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
opt-level = 1