[package]
name = "aeroos"
version = "1.7.0"
edition = "2021"
description = "AeroOS - Portable OS in a single executable"

[dependencies]
whpx   = { path = "vendor/whpx" }
conpty = { path = "vendor/conpty" }
rust-embed       = "8.12"
hyper            = { version = "1.0", features = ["full"] }
hyper-util       = { version = "0.1", features = ["full"] }
http-body-util   = "0.1"
tower            = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
futures-util     = "0.3"
tokio            = { version = "1.0", features = ["full"] }
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
toml             = "0.8"
lz4_flex         = "0.11"
blake3           = "1.5"
aes-gcm          = "0.10"
argon2           = "0.5"
rand             = "0.8"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
mime_guess       = "2.0"
thiserror        = "2.0"
anyhow           = "1.0"
hex              = "0.4"
sha2             = "0.10"
base64           = "0.22"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "libloaderapi", "errhandlingapi", "memoryapi",
    "consoleapi", "handleapi", "namedpipeapi",
    "processenv", "winbase", "wincon", "winnt", "fileapi",
    "minwindef", "winuser", "std"
] }

[features]
default = []
ape = ["dep:cosmo-build"]
encryption = []

[build-dependencies]
cosmo-build = { version = "5", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = { version = "5", optional = true }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"