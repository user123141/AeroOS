[package]
name = "aeroagent"
version = "0.1.0"
edition = "2021"
description = "AeroOS guest agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[[bin]]
name = "aeroagent"
path = "src/main.rs"